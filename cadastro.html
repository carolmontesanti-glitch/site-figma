<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    
    <title>Document</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <!-- Caixa principal do cadastro -->
    <div class="cadastro">

        <!-- Título -->
        <h1>Cadastro</h1>

        <!-- Texto de apresentação -->
        <p>Crie sua conta</p>

        <!-- Formulário de cadastro -->
        <form>

            <!-- Campo nome -->
            <label for="nome">Nome</label>

            <input
                type="text"
                id="nome"
                name="nome"
                placeholder="Digite seu nome"
            >

            <!-- Campo de e-mail -->
            <label for="email">E-mail</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Digite seu e-mail"
            >

            <!-- Campo de usuário -->
            <label for="usuario">Usuário</label>

            <input
                type="text"
                id="usuario"
                name="usuario"
                placeholder="Crie um usuário"
            >

            <!-- Campo de senha -->
            <label for="senha">Senha</label>

            <input
                type="password"
                id="senha"
                name="senha"
                placeholder="Crie uma senha"
            >

            <!-- Campo para confirmar a senha -->
            <label for="confirmarSenha">Confirmar senha</label>

            <input
                type="password"
                id="confirmarSenha"
                name="confirmarSenha"
                placeholder="Digite a senha novamente"
            >

            <!-- Botão para cadastrar -->
            <button type="submit">
                Cadastrar
            </button>

        </form>

        <!-- Link para quem já possui cadastro -->
        <p>
            Já possui uma conta?
            <a href="login.html">Faça login</a>
        </p>

    </div>
</body>
</html>
